#
# Bundle 1 of 2: the `ppt-maker` Agent preset (persona + fs/web/compaction).
# The dsh-ppt tools (ppt_themes / ppt_templates / ppt_create / ppt_edit /
# ppt_check / ppt_render / ppt_undo) are mounted host-level by the `dsh-ppt`
# plugin and inherited by every preset agent, so they are NOT re-mounted here.
